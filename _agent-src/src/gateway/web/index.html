<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>floria</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/icon.ico" />
  <!-- 2026-08-28 资源改绝对路径：SPA 路径路由（/session/<hash> 等）下相对路径会解析到子路径 404 -->
  <link rel="stylesheet" href="/styles.css?v=306" />
</head>
<body>
<div id="app">

  <!-- 左侧侧栏：rail（折叠态 64px 极简）+ panel（展开态 280px） -->
  <div id="sidebar">
    <nav id="rail">
      <div id="rail-top">
        <button id="rail-logo" class="rail-ico" title="floria · 展开侧栏"></button>
      </div>
      <div id="rail-mid">
        <button id="rail-toggle" class="rail-ico" title="展开侧栏"></button>
        <button id="rail-new" class="rail-ico" title="新建对话（回到首页）"></button>
        <button id="rail-search" class="rail-ico" title="搜索会话"></button>
        <button id="rail-bubble" class="rail-ico" title="最近会话"></button>
      </div>
      <div id="rail-bottom">
        <div id="rail-avatar" title="只读查看 · 本地工作区">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.7-8 6v2h16v-2c0-3.3-3.6-6-8-6z"/></svg>
        </div>
      </div>
    </nav>
    <aside id="panel">
      <div class="panel-inner">
        <div class="panel-header">
          <button class="floria-logo" title="折叠侧栏">
            <img class="brand-ico" src="/icon.ico" alt="Floria" />
            <span>Floria</span><span id="floria-conn"></span>
          </button>
          <div class="panel-actions">
            <button id="panel-search" class="act-btn" title="搜索会话"></button>
            <button id="panel-collapse" class="act-btn" title="折叠侧栏"></button>
          </div>
        </div>
        <!-- 管理入口 tabs：插件（含技能预览）+ 项目（样式同 .mtab 但高度/字体放大） -->
        <div class="mgr-tabs" id="mgr-tabs">
          <button class="mgr-tab on" data-mgr="plugins" title="插件 / 技能预览">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10.2 3.5H4.6a1.1 1.1 0 0 0-1.1 1.1v5.6a1.1 1.1 0 0 0 1.1 1.1h5.6a1.1 1.1 0 0 0 1.1-1.1V4.6a1.1 1.1 0 0 0-1.1-1.1z"/><path d="M19.4 3.5h-5.6a1.1 1.1 0 0 0-1.1 1.1v5.6a1.1 1.1 0 0 0 1.1 1.1h5.6a1.1 1.1 0 0 0 1.1-1.1V4.6a1.1 1.1 0 0 0-1.1-1.1z"/><path d="M10.2 13.7H4.6a1.1 1.1 0 0 0-1.1 1.1v5.6a1.1 1.1 0 0 0 1.1 1.1h5.6a1.1 1.1 0 0 0 1.1-1.1v-5.6a1.1 1.1 0 0 0-1.1-1.1z"/><path d="M19.4 13.7h-5.6a1.1 1.1 0 0 0-1.1 1.1v5.6a1.1 1.1 0 0 0 1.1 1.1h5.6a1.1 1.1 0 0 0 1.1-1.1v-5.6a1.1 1.1 0 0 0-1.1-1.1z"/></svg>
            <span>插件</span>
          </button>
          <button class="mgr-tab" data-mgr="projects" title="项目管理">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
            <span>项目</span>
          </button>
          <button class="mgr-tab" data-mgr="models" title="模型配置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3.5v3M14.5 3.5v3M9.5 17.5v3M14.5 17.5v3M3.5 9.5h3M3.5 14.5h3M17.5 9.5h3M17.5 14.5h3"/></svg>
            <span>模型</span>
          </button>
        </div>
        <div id="recent">
          <div id="recent-head">
            <div id="recent-left">
              <span id="recent-label">最近</span>
            </div>
            <div id="recent-right">
              <button id="recent-more" class="rh-btn" title="整理会话">…</button>
              <button id="recent-write" class="rh-btn" title="新建对话（回到首页）"></button>
            </div>
            <div id="organize-pop" class="popup">
              <div class="org-title">整理会话</div>
              <div class="org-opts">
                <button class="org-opt on" data-mode="list"><span>在一个列表中</span><span class="check">✓</span></button>
                <button class="org-opt" data-mode="project"><span>按项目展开</span><span class="check">✓</span></button>
              </div>
            </div>
          </div>
          <div class="mode-tabs hidden" id="mode-tabs">
            <button class="mtab on" data-pt="projects">项目</button>
            <button class="mtab" data-pt="chats">聊天</button>
          </div>
          <div id="recent-body"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 移动端抽屉遮罩（≤720px 侧栏滑入时出现，点空白关闭） -->
  <div id="scrim"></div>

  <!-- 主聊天区 -->
  <main id="chat-area">
    <!-- token 门背景层（2026-08-17 SubPj3 复刻版，严格照抄 SubPj3 demo 的相对位置）：
         全屏渐变背景 + 居中正方形角色画面（.g-stage）——举白板图铺满 stage + token 表单嵌白板内
         （#g-card left 26%/top 47%，白板实测 x25-58/y45-72）→ 视频过渡（白板拉伸成输入栏）→
         趴栏 + 欢迎胶囊（顶部 3.2%）。验证通过（video ended）→ hideGate 进空态（同趴栏，无缝）。
         仅 body.token-gate 显示；showGate() 去 hidden、hideGate() 恢复。 -->
    <div id="gate-screen" hidden>
      <div class="g-stage" id="g-stage">
        <div class="g-media">
          <img id="g-token" class="g-ph" src="/gate/state-token.webp?v=2" alt="请求 Token"/>
          <video id="g-video" class="g-ph" muted playsinline preload="auto">
            <source src="/gate/transition.webm?v=2" type="video/webm"/>
            <source src="/gate/transition.mp4?v=2" type="video/mp4"/>
          </video>
          <img id="g-new" class="g-ph" src="/gate/state-newchat.webp?v=2" alt="新对话"/>
        </div>
        <div class="g-ui">
          <!-- 阶段1：token 表单嵌角色白板内（无边界纯隐藏胶囊输入栏，回车提交） -->
          <div id="g-card">
            <div class="g-bar">
              <!-- 2026-08-28 设备认证配对：不再输入 token，门显示设备请求码，PC /server auth add 后自动进入 -->
              <div id="g-pair">
                <div id="g-pair-code">— — — —</div>
                <div class="g-pair-hint">PC 端运行 /server auth add &lt;请求码&gt; 完成授权</div>
              </div>
            </div>
          </div>
          <!-- 阶段2：过渡视频（验证提示已按用户要求移除 2026-08-18） -->
          <!-- 阶段3：趴栏（欢迎胶囊已按用户要求移除 2026-08-18） -->
        </div>
      </div>
    </div>
    <button id="menu-btn" title="打开侧栏" aria-label="打开侧栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- 角色形象：左侧空缺处展示，随 AI 操作切换（读/搜=3、写/编=2、执行/命令=4、其余=1）。
         仅已开始的对话（#chat-area.in-session）+ 侧栏折叠（#sidebar 无 .open）+ 宽屏时显示，
         首页新对话不显示；pointer-events:none 不挡交互。
         2026-08-15 临时隐藏中：styles.css #char display:none（代码保留空跑），删除该行即恢复 -->
    <img id="char" src="/char/1.jpg" alt="AI 形象" draggable="false" />
    <div id="chat-scroll"><div id="messages"></div></div>
    <!-- 空态（token 门验证后）：与 SubPj3 阶段3 一致——居中正方形趴栏图铺满；
         输入栏（#input-wrap）在 stage 内真相对定位（SubPj3 同款：top=台面 76.75% − 半高 26px），
         任意窗口大小都贴图走不偏移；app.js 按界面在 stage（空态）↔ chat-area（会话 docked）间移动挂载 -->
    <div id="empty-hint">
      <div class="g-stage">
        <div class="g-media">
          <img class="g-ph empty-ico" src="/gate/state-newchat.webp?v=2" alt="Floria" />
        </div>
        <div id="input-wrap">
          <!-- 输入栏（2026-08-21 dsh InputBar 完全移植：照抄 deepseek-harness InputBar.module.css .card 布局——
               textarea(#input) 顶部 + 底部 .row 工具行[左 .tools = .add(+命令) + .modes（只读无权限数据→空） +
               右 .trailing = .trigger 模型·推理座 + .primary 发送]。
               2026-08-21 用户纠正：完全移植源码，不再自作主张加 upload/think/mic 胶囊） -->
          <div id="input-bar">
            <!-- 图片附件胶囊（2026-08-28）：待发送图片缩略图行；入口在 + 浮窗「图片」tab（vision 门控） -->
            <div id="img-pills" hidden></div>
            <div id="input" contenteditable="true" role="textbox" aria-multiline="true" data-ph="输入消息，Enter 发送"></div>
            <div class="row">
              <div class="tools">
                <input id="img-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
                <button id="cmd-btn" class="add" title="命令" aria-label="命令" aria-haspopup="listbox"></button>
                <!-- 项目选择器（2026-09-02）：空态=右侧切换目标项目（=侧栏项目「+」同链路 state.newProject，
                     首条消息按它落项目）；会话态=工作文件夹标识保留显示但锁定只读（.locked 白底无箭头，
                     #chat-area.in-session 门控；管理/预览态挂载点不在 chat-area 自动隐藏） -->
                <div id="proj-root" class="proj-root">
                  <button id="proj-seat" class="proj-seat" title="目标项目" aria-label="目标项目" aria-haspopup="menu">
                    <span class="projIco"></span><span class="projLabel">全局</span><span class="chevron"></span>
                  </button>
                  <div id="proj-pop" hidden></div>
                </div>
                <div class="modes"></div>
              </div>
              <div class="trailing">
                <!-- 模型·推理座（dsh ModelSelect .root：.trigger chip + .menu 定位上下文） -->
                <div id="model-root" class="model-root">
                  <button id="model-seat" class="trigger" title="模型与推理等级" aria-label="模型与推理等级" aria-haspopup="menu">
                    <span class="triggerLabel"></span>
                    <span class="triggerEffort"></span>
                    <span class="chevron"></span>
                  </button>
                  <!-- 模型·推理等级弹窗（dsh ModelSelect .menu）：root→Model/Effort 两级 drill -->
                  <div id="model-pop" hidden></div>
                </div>
                <!-- 上下文占用（dsh ContextMeter）：发送钮左边的环形小圆，展示上下文已用百分比，
                     点击展开 breakdown 面板。数据来自 /api/session 的 context 字段（网关提取）。
                     无数据（无 usage / 无模型窗口）时 hidden。 -->
                <div id="ctx-meter" class="ctx-meter" hidden>
                  <button id="ctx-btn" class="ctx-trigger" type="button" title="上下文已用" aria-label="上下文已用" aria-haspopup="dialog" aria-expanded="false"></button>
                  <div id="ctx-panel" class="ctx-panel" role="dialog" aria-label="上下文已用" hidden></div>
                </div>
                <button id="send-btn" class="primary" title="只读查看 · 无法发送" aria-label="发送"></button>
              </div>
            </div>
            <!-- composer takeover（2026-08-22 占输入栏；2026-09-08 三轮迁入 #input-bar 子元素位，用户定案：
                 审批/提问 UI 是输入栏的子元素，出现=输入栏自身大小变化（外观让位 .bar-takeover，输入内容组
                 隐藏，卡即输入栏本体），不再是兄弟节点替换 -->
            <div id="composer-takeover" hidden></div>
            <!-- 底栏任务浮窗（2026-09-10；几何 09-11 二轮定案）：CLI TodoV2 清单（源码 useTasksV2 单源出口
                 → task-state 链）在底栏上的生长式浮窗。输入栏（#input-bar）的子元素、贴其上沿定位（bottom:100%）：
                 收敛态露出 12px 把手条（#task-lip，白表面+1px 0.10 描边，与输入栏/面板同族材质），
                 点击上展 .td-panel（宽=输入栏宽−48px 居中、
                 底边与输入栏上沿留 --td-gap=10px 间距、最高 min(40vh,460px) 内部滚动），再点头部向下收敛。
                 无清单整窗 hidden；审批/提问接管卡在场 → .blocked 收敛且禁点（.bar-takeover 规则本就 display:none 让位）。 -->
            <div id="task-dock" hidden>
              <button id="task-lip" class="td-lip" type="button" aria-expanded="false" aria-controls="task-panel" title="展开任务清单"></button>
              <div id="task-panel" class="td-panel" role="region" aria-label="任务清单"></div>
            </div>
          </div>
          <!-- 命令菜单（dsh PopupSelectView shell：.search + .status + .viewport[.row .label/.detail/.check]） -->
          <div id="cmd-pop" hidden></div>
          <!-- @ 提及浮窗：输入 @ 时在输入栏上方弹出（插件/技能 + 近48h 会话），宽度=输入栏 -->
          <!-- 文件变更胶囊已移除（2026-08-26 任务 C）：实时变更改在处理折叠内内联展示，不再悬浮输入栏上方 -->
          <div id="mention-pop" hidden></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 聊天气泡弹层（最近会话，贴在 rail 附近） -->
<div id="bubble-pop" class="popup"></div>

<!-- 搜索覆盖层 -->
<div id="search-overlay">
  <div id="search-box">
    <div class="s-top">
      <span class="s-title">搜索</span>
      <button id="search-close" title="关闭">✕</button>
    </div>
    <div class="search-row"><span id="s-mag"></span><input id="search-input" placeholder="搜索全部对话…"></div>
    <div id="search-results"></div>
  </div>
</div>

<!-- 风险确认门（dsh RiskConfirmation + Modal：全屏遮罩 + 居中对话框） -->
<div id="risk-modal" hidden></div>
<!-- 会话重命名弹窗（2026-08-24 侧栏行操作 · DSH rename dialog 移植：mask + dialog + input + 确认） -->
<div id="rename-modal" hidden>
  <div class="mask"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-label="重命名会话">
    <div class="header">
      <h2 class="title">重命名会话</h2>
      <button type="button" class="close" aria-label="关闭"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.1168 13.197L13.197 14.1167L1.8833 2.80303L2.80309 1.88324L14.1168 13.197Z"/><path d="M13.197 1.88326L14.1168 2.80305L2.80309 14.1168L1.8833 13.197L13.197 1.88326Z"/></svg></button>
    </div>
    <div class="body">
      <input id="rename-input" class="rename-input" type="text" placeholder="输入新标题" maxlength="200" autocomplete="off"/>
      <div id="rename-error" class="rename-error" role="alert" hidden></div>
    </div>
    <div class="footer">
      <button type="button" class="button outline" id="rename-cancel">取消</button>
      <button type="button" class="button primary" id="rename-ok">重命名</button>
    </div>
  </div>
</div>
<div id="drop-overlay" hidden><div class="drop-hint">松开以添加图片</div></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js?v=306"></script>
</body>
</html>
