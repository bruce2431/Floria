<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>floria</title>
  <meta name="theme-color" content="#ececf1" /><!-- = 底板色（--plane），与页面底色同源；夜晚模式由下方预置脚本改写 -->
  <!-- 主题预置（2026-10-06 夜晚模式）：必须排在样式表之前——先把 data-theme 落到 <html>，样式表按它
       解析，首帧即正确、无白/黑闪帧。缺省跟随系统 prefers-color-scheme；手动切换后写
       localStorage['floria-theme']（'light'|'dark'）覆盖系统。theme-color（=底板色）随之同步，
       免移动端地址栏与页面底色割裂。（app.js 侧只做切换/图标，不再重复判定首帧。） -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('floria-theme') } catch (e) { /* 存储不可用则按跟随系统 */ }
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#000000' : '#ececf1');
    })();
  </script>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/icon.ico" />
  <!-- 2026-08-28 资源改绝对路径：SPA 路径路由（/session/<hash> 等）下相对路径会解析到子路径 404 -->
  <!-- KaTeX 公式样式（2026-10-06）：须排在 /styles.css 之前，本项目的 .math-block/.md-math 覆盖其后 -->
  <link rel="stylesheet" href="/vendor/katex/katex.min.css?v=473" />
  <link rel="stylesheet" href="/styles.css?v=497" />
</head>
<body>
<div id="app">

  <!-- 左侧侧栏（2026-09-25 折叠态改定案）：折叠态宽度归 0（主区满宽），唤出入口 = 内容卡左上角汉堡
       #menu-btn（点击 = 打开并钉住）+ 窗口左缘唤出（app.js document 级监听，悬停预览式、移出即收）；展开态 = panel（280px） -->
  <div id="sidebar">
    <aside id="panel">
      <div class="panel-inner">
        <div class="panel-header">
          <!-- 侧栏模式切换（2026-09-25）：floria·chat = 现有侧栏（管理 tabs + 最近列表）；
               floria·work = Prism 式工作区（项目切换 / 文件·聊天 tab / 文件树 / 工作区卡），
               主区随之变两栏（编辑区 + 助手）。原 .floria-logo 品牌按钮由本 tab 取代；
               折叠入口仍是右侧 #panel-collapse（全视口可见），连接状态移到「最近」行。 -->
          <div class="mode-switch" id="mode-switch">
            <!-- 唯一一块「空位」（.ms-thumb）：卡面缺掉的一块，**落在非当前模式那侧**；处于的模式那侧
                 不画任何元素（与背景同色），只翻字色（样式见 styles.css「侧栏 chat / work 双模式」段；
                 位置由 work.js positionMsThumb() 实测写入） -->
            <span class="ms-thumb" aria-hidden="true"></span>
            <button class="ms-btn on" data-sbmode="chat">floria·chat</button>
            <button class="ms-btn" data-sbmode="work">floria·work</button>
          </div>
          <!-- 顶栏三件套（2026-10-08 定案）：🔍搜索 / 🌙日夜 / ⇤折叠 两模式**同一位置、同一形态**
               （.panel-actions 同一行）；个性化只在第三槽——chat = #panel-collapse（折叠侧栏），
               work = #wk-view（视图开关，管右栏预览列与侧栏开合）。显隐由 `#panel.work` 钩子切（见
               styles.css），不各写各的选择器。搜索两模式共用 #panel-search → #search-overlay，
               只是 work 下内容限到当前项目（bubble-search.js renderSearch 按 state.sbMode 分派）。 -->
          <div class="panel-actions">
            <button id="panel-search" class="act-btn" title="搜索"></button>
            <!-- 主题切换（2026-10-06 夜晚模式）：日/月图标由 app.js 按当前 data-theme 注入，点击在
                 浅/暗间翻转并写 localStorage['floria-theme']（头部预置脚本据此免闪帧）。 -->
            <button id="panel-theme" class="act-btn" title="切换主题" aria-label="切换深浅色主题"></button>
            <button id="panel-collapse" class="act-btn" title="折叠侧栏"></button>
            <button id="wk-view" class="act-btn" title="视图开关" aria-haspopup="dialog"></button>
            <div id="wk-view-pop" class="popup" hidden>
              <div class="wkv-title">视图</div>
              <button class="wkv-row" data-wkpane="workspace"><span>预览</span><span class="wkv-sw"></span></button>
              <button class="wkv-row" data-wkpane="sidebar"><span>侧边栏</span><span class="wkv-sw"></span></button>
            </div>
          </div>
        </div>
        <div id="chat-panel">
        <!-- 管理入口 tabs（插件 / 项目 / 模型 / 神经）：定义单一真源 = web-src/views/registry.js，
             启动时 renderMgrTabs() 按表生成（本处不再有死按钮与内联 SVG；图标取 core/icons.js 的 I 表） -->
        <div class="mgr-tabs" id="mgr-tabs"></div>
        <div id="recent">
          <div id="recent-head">
            <div id="recent-left">
              <span id="recent-label">最近</span>
              <!-- 连接状态（原在 Floria 品牌名后，2026-09-25 随模式 tab 顶替品牌行迁来；setConn 链不变） -->
              <span id="floria-conn"></span>
            </div>
            <div id="recent-right">
              <button id="recent-more" class="rh-btn" title="整理会话">…</button>
              <button id="recent-write" class="rh-btn" title="新建对话（回到首页）"></button>
            </div>
            <div id="organize-pop" class="popup">
              <div class="org-title">整理会话</div>
              <div class="org-opts">
                <button class="org-opt on" data-mode="list"><span>在一个列表中</span><span class="check">✓</span></button>
                <button class="org-opt" data-mode="project"><span>按项目展开</span><span class="check">✓</span></button>
              </div>
            </div>
          </div>
          <div class="mode-tabs hidden" id="mode-tabs">
            <button class="mtab on" data-pt="projects">项目</button>
            <button class="mtab" data-pt="chats">聊天</button>
          </div>
          <div id="recent-body"></div>
        </div>
        </div><!-- /#chat-panel -->

        <!-- work 模式侧栏（2026-09-25，参考 Prism）：骨架在此，内容由 web-src/sidebar/work.js 渲染。
             项目切换下拉 = state.projects（/gateway/sessions 的 groups）；文件树 = /gateway/project 的
             files；点文件 → 主区 #work-editor 只读打开（/gateway/file）。 -->
        <div id="work-panel" hidden>
          <div class="wk-head">
            <button id="wk-proj-seat" class="wk-proj" title="切换项目" aria-haspopup="menu">
              <span class="wk-proj-ico"></span><span class="wk-proj-label">选择项目</span><span class="chevron"></span>
            </button>
            <div id="wk-proj-pop" class="popup" hidden></div>
          </div>
          <div class="wk-tabs">
            <button class="wk-tab on" data-wktab="files">文件</button>
            <button class="wk-tab" data-wktab="chat">聊天</button>
            <div class="wk-tools">
              <button id="wk-new" class="wk-ico" title="新建聊天" aria-haspopup="menu"></button>
              <div id="wk-new-pop" class="popup" hidden>
                <button class="wkn-row" data-wknew="file">创建文件</button>
                <button class="wkn-row" data-wknew="dir">创建文件夹</button>
                <button class="wkn-row" data-wknew="upload-file">上传文件</button>
                <button class="wkn-row" data-wknew="upload-dir">上传文件夹</button>
              </div>
            </div>
          </div>
          <div class="wk-body" id="wk-body"></div>
          <div class="wk-foot" id="wk-foot">
            <span class="wk-foot-ico"></span>
            <span class="wk-foot-text" id="wk-foot-text">Floria</span>
          </div>
        </div>
      </div>
    </aside>
    <!-- 拖拽调宽把手（2026-09-12）：仅桌面展开态可见（styles.css 门控），拖动改 :root 内联 --panel-w；
         不持久化——折叠时 JS 移除内联变量，再展开回默认 280px -->
    <div id="panel-resizer" title="拖拽调整侧栏宽度"></div>
  </div>

  <!-- 移动端抽屉遮罩（≤720px 侧栏滑入时出现，点空白关闭） -->
  <div id="scrim"></div>

  <!-- 主聊天区 -->
  <main id="chat-area">
    <!-- token 门背景层（2026-08-17 SubPj3 复刻版，严格照抄 SubPj3 demo 的相对位置）：
         全屏渐变背景 + 居中正方形角色画面（.g-stage）——举白板图铺满 stage + token 表单嵌白板内
         （#g-card left 26%/top 47%，白板实测 x25-58/y45-72）→ 视频过渡（白板拉伸成输入栏）→
         趴栏 + 欢迎胶囊（顶部 3.2%）。验证通过（video ended）→ hideGate 进空态（同趴栏，无缝）。
         仅 body.token-gate 显示；showGate() 去 hidden、hideGate() 恢复。 -->
    <div id="gate-screen" hidden>
      <div class="g-stage" id="g-stage">
        <div class="g-media">
          <img id="g-token" class="g-ph" src="/gate/state-token.webp?v=2" alt="请求 Token"/>
          <video id="g-video" class="g-ph" muted playsinline preload="auto">
            <source src="/gate/transition.webm?v=2" type="video/webm"/>
            <source src="/gate/transition.mp4?v=2" type="video/mp4"/>
          </video>
          <img id="g-new" class="g-ph" src="/gate/state-newchat.webp?v=3" alt="新对话"/>
        </div>
        <div class="g-ui">
          <!-- 阶段1：token 表单嵌角色白板内（无边界纯隐藏胶囊输入栏，回车提交） -->
          <div id="g-card">
            <div class="g-bar">
              <!-- 2026-08-28 设备认证配对：不再输入 token，门显示设备请求码，PC /server auth add 后自动进入 -->
              <div id="g-pair">
                <div id="g-pair-code">— — — —</div>
                <div class="g-pair-hint">PC 端运行 /server auth add &lt;请求码&gt; 完成授权</div>
              </div>
            </div>
          </div>
          <!-- 阶段2：过渡视频（验证提示已按用户要求移除 2026-08-18） -->
          <!-- 阶段3：趴栏（欢迎胶囊已按用户要求移除 2026-08-18） -->
        </div>
      </div>
    </div>
    <!-- 左缘唤出由 app.js 的 document 级监听承担（mousemove clientX ≤ 8 / mouseout 从左缘出窗口），
         无对应元素——细条 hit-test 会被快速移动整段跳过 -->
    <button id="menu-btn" title="打开侧栏" aria-label="打开侧栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- 角色形象：左侧空缺处展示，随 AI 操作切换（读/搜=3、写/编=2、执行/命令=4、其余=1）。
         仅已开始的对话（#chat-area.in-session）+ 侧栏折叠（#sidebar 无 .open）+ 宽屏时显示，
         首页新对话不显示；pointer-events:none 不挡交互。
         2026-08-15 临时隐藏中：styles.css #char display:none（代码保留空跑），删除该行即恢复 -->
    <!-- 下沉区顶栏（2026-10-06）：work 模式主区顶部的 tab 条（参考 Prism）——[+] [聊天] [文件名] [工具栏]。
         同一时刻只有一个内容在场（聊天 tab / 文件 tab），右栏卡（#work-preview）常驻最右、两态切换。
         tab 由 sidebar/work.js 的 renderTopbar 动态渲染进 #wk-tb-tabs；末尾胶囊（#wk-tb-tool，与聊天
         胶囊同 .wk-tb-pill 形）切右栏页态：预览态 = 插件图标 + 「工具栏」（点入工具页），工具态 = ✕ +
         「关闭」（点回预览态）。图标/文字由 work.js 的 applyPvTab 写（不在此预置）。
         grid 放置见 styles.css #chat-area.work。 -->
    <div class="wk-topbar" id="wk-topbar">
      <button id="wk-tb-new" class="wk-ico" title="新建聊天" aria-label="新建聊天"></button>
      <div class="wk-tb-tabs" id="wk-tb-tabs"></div>
      <button id="wk-tb-tool" class="wk-tb-pill" title="工具栏" aria-label="工具栏"><span class="wk-tb-ico"></span><span class="wk-tb-name">工具栏</span></button>
    </div>

    <!-- 工作区编辑区（2026-09-25 work 模式）：查看/编辑项目内文件 = 「文件 tab」的内容，与
         #session-card（聊天 tab 内容）在同一格（下沉区 col1/row2）二选一显示。刻意不用 .view-card 类——
         它是 work 模式的常驻栏，若带该类会落入 registry 的「槽里同一时刻恰好一张卡」语义。
         正文由 sidebar/work.js 挂 CodeMirror 6 编辑器（恒可编辑）；#wk-ed-save = 保存态文本。 -->
    <section id="work-editor">
      <div class="wk-ed-head">
        <span id="wk-ed-path" class="wk-ed-path"></span>
        <span id="wk-ed-save" class="wk-ed-save"></span>
      </div>
      <div class="wk-ed-body" id="wk-ed-body"></div>
    </section>

    <!-- 分界条（2026-09-27）：work 下沉区 ↔ 预览列的拖拽调宽条（参考 Pj18 preview 的 #divider）。
         只剩一条（预览在最右），显隐由 work.js 的 applyPanes 按「预览在场且已展开」判定。 -->
    <div class="work-gutter"></div>

    <!-- work 右栏卡（2026-09-26 第三栏；2026-10-07 参考 Prism 定两态，与下沉区同属 #chat-area 三列）：
         页态真源 = state.wkPvTab（work.js applyPvTab 唯一落）——'' = 预览态（挂 #wk-pv-body，内容由
         mountPreview 渲，与「项目」视图卡同一份三级链）/ 工具 id = 工具态（#wk-pv-tabs 顶 tab 条 +
         该工具 pane）。tab 由 work-tools.js 注册表渲染（内部注册序 = tab 序，外部模块可 registerWkTool
         追加）；pane 互斥显隐也归 applyPvTab。内置工具 = 评论（pane #wk-cmt，sidebar/comments.js 渲）。
         显隐由顶栏「工具栏」胶囊（#wk-tb-tool）或视图浮层的「预览」开关驱动。
         同 #work-editor，不用 .view-card —— 它是 work 模式常驻栏，不是槽位卡。 -->
    <section id="work-preview">
      <div class="wk-pv-tabs" id="wk-pv-tabs" hidden></div>
      <div class="wk-pv-body" id="wk-pv-body"></div>
      <div class="wk-cmt" id="wk-cmt" hidden></div>
    </section>

    <!-- 会话卡（视图注册表 tab:false 一条，视图卡化 2026-09-23）：#char / #chat-scroll / #empty-hint
         承载模块级 const 引用的单例 DOM（messagesEl / inputWrap / charEl），不能随卡销毁重建
         → 常驻此处，离开会话视图只切 hidden。槽里同一时刻恰好一张卡：管理/预览卡由注册表按需创建。 -->
    <section id="session-card" class="view-card session">
      <!-- 助手头部（work 模式专用，2026-09-27）：三态切换 + 关掉。chat 模式与细条态由 CSS 整体藏起，
           不参与会话卡原有布局。图标 = 内联 SVG（16px 描线，与顶栏/侧栏 .wk-ico 同一套语言）。 -->
      <div class="wk-assist-head">
        <span class="wk-assist-title">助手</span>
        <span class="wk-assist-acts">
          <button class="wk-ico" id="wk-assist-slim" title="收成输入栏" aria-label="收成输入栏">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.2 8 10.2 12 6.2"/></svg>
          </button>
          <button class="wk-ico" id="wk-assist-dock" title="靠回栏" aria-label="靠回栏">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="3" width="12.4" height="10" rx="2.2"/><path d="M9.9 3v10"/></svg>
          </button>
          <button class="wk-ico" id="wk-assist-float" title="浮起" aria-label="浮起">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="5.8" width="8.4" height="8.4" rx="2.2"/><path d="M6.6 1.8h5.4a2.2 2.2 0 0 1 2.2 2.2v5.4"/></svg>
          </button>
          <button class="wk-ico" id="wk-assist-close" title="关掉助手" aria-label="关掉助手">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"/></svg>
          </button>
        </span>
      </div>
      <!-- 悬浮卡高度把手（只在悬浮态露出）：左上角，只改高度——宽恒由锚栏宽给定 -->
      <div class="wk-assist-grip" id="wk-assist-grip" title="拖动调整高度"></div>
      <!-- 收敛态 = 一条输入栏（不是胶囊按钮）：点它弹回悬浮卡。同一张助手卡的第三种形态，无第二套发送链 -->
      <button class="wk-assist-pill" id="wk-assist-pill" title="展开助手">
        <span class="wap-ph">随便提问</span>
        <!-- 箭头图标由 work.js mountWork 注入 I.dshSend（与正常底栏发送钮同源），勿在此内联自绘 -->
        <span class="wap-arrow"></span>
      </button>
      <img id="char" src="/char/1.jpg" alt="AI 形象" draggable="false" />
      <div id="chat-scroll"><div id="messages"></div></div>
      <!-- composer 遮罩（2026-10-03 移植 dsh ConversationRoot .composerSeat 渐隐带）：会话态贴底栏
           区域做全卡宽「透明→底色」渐隐——chat 消息流在底栏上方 36px 内淡出、其下实心遮住滚过的
           消息（底栏两侧与下方）。高度 = 底栏高（--bar-h，core/viewport.js settle 实测）+ 22px 底距
           + 36px 渐隐带，故多行/接管卡长高时渐隐带随底栏上沿同步上移。z-index 3：盖住消息流
           （含 sticky 头 z1），低于 #input-wrap（z5）与 #char（z4）；pointer-events:none 不挡交互。 -->
      <div id="composer-mask" aria-hidden="true"></div>
      <!-- 空态（token 门验证后）：与 SubPj3 阶段3 一致——居中正方形趴栏图铺满；
           输入栏（#input-wrap）在 stage 内真相对定位（SubPj3 同款：台面中心锚 76.75%），
           任意窗口大小都贴图走不偏移；app.js 按界面在 stage（空态）↔ 会话卡（会话 docked）间移动挂载 -->
      <div id="empty-hint">
        <div class="g-stage">
          <div class="g-media">
            <img class="g-ph empty-ico" src="/gate/state-newchat.webp?v=3" alt="Floria" />
          </div>
          <div id="input-wrap">
            <!-- 输入栏（2026-08-21 dsh InputBar 完全移植：照抄 deepseek-harness InputBar.module.css .card 布局——
                 textarea(#input) 顶部 + 底部 .row 工具行[左 .tools = .add(+命令) + .modes（只读无权限数据→空） +
                 右 .trailing = .trigger 模型·推理座 + .primary 发送]。
                 2026-08-21 用户纠正：完全移植源码，不再自作主张加 upload/think/mic 胶囊） -->
            <div id="input-bar">
              <!-- 附件胶囊（2026-08-28 图片 / 2026-09-12 文件）：待发送附件行；入口在 + 浮窗「上传」组 -->
              <div id="img-pills" hidden></div>
              <div id="input" contenteditable="true" role="textbox" aria-multiline="true" data-ph="输入消息，Enter 发送"></div>
              <div class="row">
                <div class="tools">
                  <input id="img-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
                  <!-- 文件上传（2026-09-12）：+ 浮窗「上传文件」行触发；POST /gateway/upload 落盘 exe 目录 uploads/ -->
                  <input id="file-upload" type="file" multiple hidden />
                  <button id="cmd-btn" class="add" title="命令" aria-label="命令" aria-haspopup="listbox"></button>
                  <!-- 项目选择器（2026-09-02）：空态=右侧切换目标项目（=侧栏项目「+」同链路 state.newProject，
                       首条消息按它落项目）；会话态=工作文件夹标识保留显示但锁定只读（.locked 白底无箭头，
                       #chat-area.in-session 门控；管理/预览态挂载点不在会话卡内自动隐藏） -->
                  <div id="proj-root" class="proj-root">
                    <button id="proj-seat" class="proj-seat" title="目标项目" aria-label="目标项目" aria-haspopup="menu">
                      <span class="projIco"></span><span class="projLabel">全局</span><span class="chevron"></span>
                    </button>
                    <div id="proj-pop" hidden></div>
                  </div>
                  <div class="modes"></div>
                </div>
                <div class="trailing">
                  <!-- 模型·推理座（dsh ModelSelect .root：.trigger chip + .menu 定位上下文） -->
                  <div id="model-root" class="model-root">
                    <button id="model-seat" class="trigger" title="模型与推理等级" aria-label="模型与推理等级" aria-haspopup="menu">
                      <span class="triggerLabel"></span>
                      <span class="triggerEffort"></span>
                      <span class="chevron"></span>
                    </button>
                    <!-- 模型·推理等级弹窗（dsh ModelSelect .menu）：root→Model/Effort 两级 drill -->
                    <div id="model-pop" hidden></div>
                  </div>
                  <!-- 上下文占用（dsh ContextMeter）：发送钮左边的环形小圆，展示上下文已用百分比，
                       点击展开 breakdown 面板。数据来自 /api/session 的 context 字段（网关提取）。
                       无数据（无 usage / 无模型窗口）时 hidden。 -->
                  <div id="ctx-meter" class="ctx-meter" hidden>
                    <button id="ctx-btn" class="ctx-trigger" type="button" title="上下文已用" aria-label="上下文已用" aria-haspopup="dialog" aria-expanded="false"></button>
                    <div id="ctx-panel" class="ctx-panel" role="dialog" aria-label="上下文已用" hidden></div>
                  </div>
                  <button id="send-btn" class="primary" title="只读查看 · 无法发送" aria-label="发送"></button>
                </div>
              </div>
              <!-- composer takeover（2026-08-22 占输入栏；2026-09-08 三轮迁入 #input-bar 子元素位，用户定案：
                   审批/提问 UI 是输入栏的子元素，出现=输入栏自身大小变化（外观让位 .bar-takeover，输入内容组
                   隐藏，卡即输入栏本体），不再是兄弟节点替换 -->
              <div id="composer-takeover" hidden></div>
              <!-- 底栏任务浮窗（2026-09-10；2026-10-04 改 dsh 任务栏形态）：CLI TodoV2 清单（源码 useTasksV2
                   单源出口 → task-state 链）在底栏上的生长式浮窗。输入栏（#input-bar）的子元素、贴其上沿定位
                   （bottom:100%）：收敛态 = 一条完整头部条（#task-lip，与面板同族白卡：列表图标 + 「任务」 +
                   计数 + chevron），点击上展 .td-panel（同一头部顶置 + 圆点状态行列表；宽=输入栏宽−48px 居中、
                   底边与输入栏上沿留 --td-gap=10px 间距、最高 min(40vh,460px,var(--bar-room,460px)) 内部滚动），
                   再点头部向下收敛。
                   无清单整窗 hidden；审批/提问接管卡在场 → .blocked 收敛且禁点（.bar-takeover 规则本就 display:none 让位）。 -->
              <div id="task-dock" hidden>
                <button id="task-lip" class="td-lip" type="button" aria-expanded="false" aria-controls="task-panel" title="展开任务清单"></button>
                <div id="task-panel" class="td-panel" role="region" aria-label="任务清单"></div>
              </div>
            </div>
            <!-- 命令菜单（dsh PopupSelectView shell：.search + .status + .viewport[.row .label/.detail/.check]） -->
            <div id="cmd-pop" hidden></div>
            <!-- @ 提及浮窗：输入 @ 时在输入栏上方弹出（插件/技能 + 近48h 会话），宽度=输入栏 -->
            <!-- 文件变更胶囊已移除（2026-08-26 任务 C）：实时变更改在处理折叠内内联展示，不再悬浮输入栏上方 -->
            <div id="mention-pop" hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 搜索覆盖层 -->
  <div id="search-overlay">
    <div id="search-box">
      <div class="s-top">
        <span class="s-title">搜索</span>
        <button id="search-close" title="关闭">✕</button>
      </div>
      <div class="search-row"><span id="s-mag"></span><input id="search-input" placeholder="搜索全部对话…"></div>
      <div id="search-results"></div>
    </div>
  </div>
  
  <!-- 风险确认门（dsh RiskConfirmation + Modal：全屏遮罩 + 居中对话框） -->
  <div id="risk-modal" hidden></div>
  <!-- 会话重命名弹窗（2026-08-24 侧栏行操作 · DSH rename dialog 移植：mask + dialog + input + 确认） -->
  <div id="rename-modal" hidden>
    <div class="mask"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="重命名会话">
      <div class="header">
        <h2 class="title">重命名会话</h2>
        <button type="button" class="close" aria-label="关闭"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.1168 13.197L13.197 14.1167L1.8833 2.80303L2.80309 1.88324L14.1168 13.197Z"/><path d="M13.197 1.88326L14.1168 2.80305L2.80309 14.1168L1.8833 13.197L13.197 1.88326Z"/></svg></button>
      </div>
      <div class="body">
        <input id="rename-input" class="rename-input" type="text" placeholder="输入新标题" maxlength="200" autocomplete="off"/>
        <div id="rename-error" class="rename-error" role="alert" hidden></div>
      </div>
      <div class="footer">
        <button type="button" class="button outline" id="rename-cancel">取消</button>
        <button type="button" class="button primary" id="rename-ok">重命名</button>
      </div>
    </div>
  </div>
</div>

<!-- 聊天气泡弹层（最近会话；原开启入口 rail-bubble 已随折叠带撤除，现无开启点——待定夺） -->
<div id="bubble-pop" class="popup"></div>

<div id="drop-overlay" hidden><div class="drop-hint">松开以添加图片</div></div>
<div id="toast" class="toast" hidden></div>
<!-- KaTeX（2026-10-06）：全局 katex（UMD），须在 app.js 之前加载——core/markdown.js 的公式预扫描
     直接调 katex.renderToString；缺失时该模块跳过公式渲染（$…$ 原样显示），故脚本顺序是硬约束。 -->
<script src="/vendor/katex/katex.min.js?v=473"></script>
<!-- CodeMirror 6 + codemirror-live-markdown（2026-10-07）：work 编辑区 md Live Preview 的全局 IIFE
     （window.CMLiveMarkdown）。须在 app.js 之前加载；公式渲染调全局 katex，故排在 KaTeX 之后。 -->
<script src="/vendor/codemirror/live-markdown.js?v=3"></script>
<script src="/app.js?v=497"></script>
</body>
</html>
