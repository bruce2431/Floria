<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目主页</title>
<link rel="stylesheet" href="default.css" />
</head>
<body>

<!-- 项目头部（简约：名称 + 描述 + tab，无 GitHub 顶栏 / Star / Fork） -->
<div class="repo-head">
  <div class="repo-head-inner">
    <div class="repo-title-row">
      <h1 class="repo-name" id="repo-name">…</h1>
    </div>
    <p class="repo-desc" id="repo-desc"></p>
    <nav class="repo-tabs" id="repo-tabs">
      <button class="repo-tab on" data-tab="code">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.5 1.75a.25.25 0 0 1 .25-.25h3a.75.75 0 0 1 0 1.5h-2.5v5.5h2.5a.75.75 0 0 1 0 1.5h-3a.25.25 0 0 1-.25-.25ZM9.25 1.5a.75.75 0 0 1 0 1.5h2.5v5.5h-2.5a.75.75 0 0 1 0 1.5h3a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25Z"/><path d="M6.647 1.646a.75.75 0 0 1 .707.5l1.706 5a.75.75 0 0 1-1.42.494l-.37-1.084H4.666l-.37 1.084a.75.75 0 1 1-1.42-.494l1.706-5a.75.75 0 0 1 .704-.5h1.36ZM5.404 5l.596 1.75h-1.19L5.404 5Z"/></svg>
        <span>代码</span>
      </button>
      <button class="repo-tab" data-tab="sessions">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.75 1h8.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 10.25 10H7.061l-2.574 2.573A1.458 1.458 0 0 1 2 11.543V2.75C2 1.784 2.784 1 3.75 1ZM8.5 4a.75.75 0 0 0-1.5 0v4a.75.75 0 0 0 1.5 0ZM8 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>
        <span>会话</span>
        <span class="tab-count" id="sess-count"></span>
      </button>
    </nav>
  </div>
</div>

<!-- 内容区 -->
<main class="repo-body">

  <!-- 代码视图：文件树 + README + About -->
  <section id="view-code" class="repo-view on">
    <div class="code-grid">
      <div class="file-panel">
        <div class="file-panel-head">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
          文件
        </div>
        <div class="file-list" id="file-list"><div class="tree-loading">加载中…</div></div>
      </div>
      <div class="code-main">
        <article class="readme-card">
          <div class="readme-head">
            <span class="readme-ic">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
            </span>
            <span class="readme-title">README.md</span>
            <span class="readme-sub">项目说明</span>
          </div>
          <div class="readme-body" id="readme-body"><div class="tree-loading">加载中…</div></div>
        </article>
      </div>
    </div>
  </section>

  <!-- 会话视图 -->
  <section id="view-sessions" class="repo-view">
    <div class="sessions-head">该项目会话</div>
    <div class="sessions-list" id="sessions-list"><div class="tree-loading">加载中…</div></div>
  </section>

</main>

<script src="default.js"></script>
</body>
</html>
